# Alice configuration
#
# This file is written to $XDG_CONFIG_HOME/alice/config.yaml on first run.
# Values shown here are the supported defaults for the first implementation.

theme:
  # One of: system, light, dark
  mode: system

  # Accent color used throughout the bar and panels.
  # Format: #RRGGBB
  accent: "#4C956C"

  # Whether the outer top bar shell should omit its background and border.
  transparent_top_bar: false

  # Gap in pixels between the bottom of the bar and the top of panel windows.
  # Default: 8
  panel_top_gap_px: 8

network:
  # Whether to show the SSID or status label next to the network icon.
  show_label: true

tray:
  # Once this many tray items are visible, the remainder are collapsed into an
  # overflow panel. The bar shows N-1 items and an overflow toggle.
  max_visible_items: 5

clock:
  # Optional label for the local time zone shown in the bar and clock panel.
  # local_time_zone_label: EST

  # Additional time zones shown in the clock panel.
  additional_time_zones:
    # Pick exactly one: offset_hours, tz_name, or tz_abbrev_name.
    # label overrides the default abbreviation shown in the UI.
    - tz_name: UTC
    - tz_name: Australia/Sydney
    # Example using a timezone abbreviation.
    # - tz_abbrev_name: AEST

power:
  # Commands are delegated to the shell and may be customized by the user.
  lock: "loginctl lock-session"
  lock_and_suspend: "loginctl lock-session && systemctl suspend"
  restart: "systemctl reboot"
  poweroff: "systemctl poweroff"

# calendar:
#   # Create a Google Cloud project, enable the Calendar API, and create
#   # OAuth 2.0 credentials (TVs and Limited Input Devices type). Paste them here.
#   # On first run, Alice will display a URL and code for device-flow auth.
#   google_client_id: "YOUR_CLIENT_ID.apps.googleusercontent.com"
#   google_client_secret: "YOUR_CLIENT_SECRET"
#   # How often (in seconds) to poll for calendar event changes. Default: 30
#   # poll_interval_secs: 30

notifications:
  # Duration in milliseconds before the freedesktop notification server
  # auto-dismisses a notification. Use 0 to never auto-dismiss. Default: 5000
  default_timeout_ms: 5000

  # Show newly received notifications as floating popup cards. Default: true
  show_notification_popup: true

  # Duration in milliseconds before popup cards disappear. Timed popup removal
  # keeps the notification unread in the notification list. Use 0 to never
  # auto-expire popups. Default: 5000
  notification_display_time_ms: 5000

  # Critical notification popups stay visible by default. Set true to apply
  # notification_display_time_ms to critical popups too. Default: false
  expire_critical_notifications: false
